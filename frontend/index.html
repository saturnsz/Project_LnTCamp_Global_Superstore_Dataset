<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoreIQ Admin — Global Superstore Dashboard</title>
  <meta name="description"
    content="Private admin dashboard for Global Superstore Dataset analytics and AI-powered transaction prediction.">
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <!-- ─── Login Slot ─────────────────────────── -->
  <div id="loginTarget"></div>

  <!-- ─── App Shell ─────────────────────────── -->
  <div class="app-layout hidden">
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileMenu()"></div>

    <!-- ─── Sidebar ───────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon"></div>
        <div class="logo-text">StoreIQ Admin</div>
        <!-- Close button for mobile -->
        <button class="sidebar-mobile-close" onclick="toggleMobileMenu()" aria-label="Close menu"
          style="display:none; margin-left:auto; background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:4px; border-radius:6px; transition:var(--transition);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Analytics</div>

        <div class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
          <span class="nav-icon"><i class="fa-solid fa-display"></i></span>
          <span class="nav-label">Dashboard</span>
        </div>

        <div class="nav-item" data-page="orders" onclick="navigateTo('orders')">
          <span class="nav-icon"><i class="fa-solid fa-box"></i></span>
          <span class="nav-label">Orders</span>
        </div>

        <div class="nav-item" data-page="products" onclick="navigateTo('products')">
          <span class="nav-icon"><i class="fa-solid fa-basket-shopping"></i></span>
          <span class="nav-label">Products</span>
        </div>

        <div class="nav-item" data-page="customers" onclick="navigateTo('customers')">
          <span class="nav-icon"><i class="fa-regular fa-user"></i></span>
          <span class="nav-label">Customers</span>
        </div>

        <div class="nav-item" data-page="locations" onclick="navigateTo('locations')">
          <span class="nav-icon"><i class="fa-solid fa-location-dot"></i></span>
          <span class="nav-label">Locations</span>
        </div>

        <div class="nav-section-label" style="margin-top:20px;">Intelligence</div>

        <div class="nav-item" data-page="ai" onclick="navigateTo('ai')">
          <span class="nav-icon"><i class="fa-solid fa-brain"></i></span>
          <span class="nav-label">AI Predictor</span>
        </div>

        <div class="nav-section-label" style="margin-top:20px;">System</div>

        <div class="nav-item" data-page="about" onclick="navigateTo('about')">
          <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
          <span class="nav-label">About</span>
        </div>

      </nav>

      <div class="sidebar-footer">
        <!-- Admin Info -->
        <div class="sidebar-user">
          <div class="sidebar-user-avatar">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name">Admin</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
        </div>

        <!-- Logout Button -->
        <button class="sidebar-logout-btn" onclick="handleLogout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="sidebar-logout-label">Logout</span>
        </button>

        <button class="collapse-btn" onclick="toggleSidebar()" style="margin-top:8px;">
          <span style="font-size:16px;"></span>
          <span class="collapse-btn-label">Collapse</span>
        </button>
      </div>
    </aside>

    <!-- ─── Main Content ──────────────────────── -->
    <div class="main-content" id="mainContent">

      <!-- Top Bar -->
      <header class="topbar">
        <button class="hamburger-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div>
          <div class="topbar-title" id="topbarTitle">Dashboard</div>
          <div class="topbar-subtitle" id="topbarSubtitle">Global Superstore Analytics</div>
        </div>

        <div class="topbar-actions" style="margin-left:auto;">
          <div class="search-bar" id="topSearchBar" style="display:none;">
            <span></span>
            <input type="text" id="topSearchInput" placeholder="Search...">
          </div>
          <button class="topbar-btn" data-tooltip="Refresh" onclick="refreshCurrentPage()"></button>
          <button class="topbar-btn" data-tooltip="Settings"></button>
          <button class="topbar-btn" data-tooltip="Notifications"></button>
          <div class="admin-avatar-wrap" id="adminAvatarWrap">
            <div class="admin-avatar" onclick="toggleAdminDropdown()" data-tooltip="Admin">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="admin-dropdown" id="adminDropdown">
              <div class="admin-dropdown-header">
                <div class="admin-dropdown-name"><i class="fa-solid fa-user"
                    style="margin-right:6px;font-size:11px;"></i>Admin</div>
                <div class="admin-dropdown-badge">
                  <span class="badge-dot"></span> Logged in as Admin
                </div>
              </div>
              <button class="admin-dropdown-item" onclick="">
                <i class="fa-solid fa-gear"></i> Settings
              </button>
              <button class="admin-dropdown-item logout" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content (loaded by loader.js) -->
      <div class="page-content" id="pageContent"></div>

    </div><!-- end main-content -->
  </div><!-- end app-layout -->

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts (loader first, then app scripts) -->
  <script src="js/loader.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/ai.js"></script>
</body>

</html>
